<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="BMI Calculator — IRON FIT fitness club."><title>BMI Calculator | IRON FIT</title><link rel="stylesheet" href="style.css"></head><body>
<header class="site-header"><nav class="navbar" aria-label="Main navigation">
<a class="logo" href="index.html" aria-label="IRON FIT home"><img src="assets/iron-fit-logo.svg" alt="IRON FIT — Train, Eat, Grow"></a>
<button class="menu-toggle" id="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false"><span></span><span></span><span></span></button>
<ul class="nav-links" id="nav-links">
<li><a href="index.html">Home</a></li><li><a href="training.html">Training</a></li><li><a href="exercises.html">Exercises</a></li><li><a href="meals.html">Meals</a></li><li><a href="nutrition.html">Nutrition</a></li><li><a href="bmi.html">BMI</a></li><li><a href="calories.html">Calories</a></li><li><a href="user/dashboard.html">Dashboard</a></li>

<!-- BMI CALCULATOR -->
<section class="bmi-section" id="bmi">

    <div class="section-title">
        <span>KNOW YOUR BODY</span>
        <h2>BMI <span>CALCULATOR</span></h2>
        <p>Calculate your Body Mass Index.</p>
    </div>

    <div class="bmi-box">

        <div class="bmi-form">
            <label>Your Weight (KG)</label>
            <input type="number" id="weight" placeholder="Example: 80">

            <label>Your Height (CM)</label>
            <input type="number" id="height" placeholder="Example: 180">

            <button type="button" id="calculate-bmi-btn" onclick="calculateBMI()">CALCULATE BMI</button>

            <div id="bmi-result"></div>
        </div>

    </div>
</section>
<footer><p>© 2026 IRON FIT. All Rights Reserved.</p></footer>
<script>const menuToggle=document.getElementById('menu-toggle');const navLinks=document.getElementById('nav-links');menuToggle?.addEventListener('click',()=>{const open=navLinks.classList.toggle('is-open');menuToggle.classList.toggle('is-active',open);menuToggle.setAttribute('aria-expanded',String(open));});navLinks?.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{navLinks.classList.remove('is-open');menuToggle?.classList.remove('is-active');menuToggle?.setAttribute('aria-expanded','false');}));</script><script>document.getElementById('calculate-bmi-btn')?.addEventListener('click',()=>{const w=Number(document.getElementById('weight').value),h=Number(document.getElementById('height').value),r=document.getElementById('bmi-result');if(!Number.isFinite(w)||w<=0||!Number.isFinite(h)||h<50||h>250){r.textContent='Please enter a valid weight and height.';return;}const v=w/Math.pow(h/100,2),c=v<18.5?'Underweight':v<25?'Normal Weight':v<30?'Overweight':'Obesity';r.innerHTML='<h3>Your BMI: '+v.toFixed(1)+'</h3><p>Category: <strong>'+c+'</strong></p><p class="bmi-note">BMI is a screening estimate, not a diagnosis.</p>';});</script></body></html>
