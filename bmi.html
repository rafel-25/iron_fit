<!DOCTYPE html>
<html lang="en"><head><link rel="icon" type="image/svg+xml" href="/favicon.svg"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="IRON FIT fitness platform"><title>BMI Calculator | IRON FIT</title><link rel="stylesheet" href="style.css"><style>.site-header{position:relative!important}.page-main{min-height:65vh;padding-top:35px}.logo img{width:155px;height:52px;object-fit:contain;display:block}.nav-links a{white-space:nowrap}@media(max-width:1050px){.nav-links{gap:14px}.nav-links a{font-size:12px}}.page-heading{padding:55px 8% 15px;text-align:center}.page-heading h1{font-size:clamp(30px,5vw,54px)}.page-heading h1 span{color:#ff2638}</style><script>function calculateBMI(){const w=Number(document.getElementById('weight').value),h=Number(document.getElementById('height').value),r=document.getElementById('bmi-result');if(!Number.isFinite(w)||w<=0||!Number.isFinite(h)||h<50||h>250){r.textContent='Please enter a valid weight and height.';return;}const v=w/((h/100)**2),c=v<18.5?'Underweight':v<25?'Normal Weight':v<30?'Overweight':'Obesity';r.innerHTML='<h3>Your BMI: '+v.toFixed(1)+'</h3><p>Category: <strong>'+c+'</strong></p><p class="bmi-note">BMI is a screening estimate, not a diagnosis.</p>';}</script></head><body><header class="site-header"><nav class="navbar" aria-label="Main navigation"><a class="logo" href="index.html" aria-label="IRON FIT home"><img src="assets/iron-fit-logo.svg" alt="IRON FIT — Train, Eat, Grow"></a><button class="menu-toggle" id="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false"><span></span><span></span><span></span></button><ul class="nav-links" id="nav-links"><li><a href="index.html">Home</a></li><li><a href="training.html">Training</a></li><li><a href="exercises.html">Exercises</a></li><li><a href="meals.html">Meals</a></li><li><a href="nutrition.html">Nutrition</a></li><li><a href="bmi.html">BMI</a></li><li><a href="calories.html">Calories</a></li><li><a href="dashboard.html">Dashboard</a></li><li><a href="profile.html">Profile</a></li></ul><div class="nav-actions"><a class="nav-login" href="login.html">LOG IN</a><a class="nav-btn" href="register.html"><span>GET STARTED</span><b>↗</b></a></div></nav></header><div class="page-main"><!-- BMI CALCULATOR -->
<section class="bmi-section" id="bmi">

    <div class="section-title">
        <span>KNOW YOUR BODY</span>
        <h2>BMI <span>CALCULATOR</span></h2>
        <p>Calculate your Body Mass Index.</p>
    </div>

    <div class="bmi-box">

        <div class="bmi-form"><p id="profile-prefill-note" class="bmi-note">Sign in and save your profile to prefill these values.</p>
            <label>Your Weight (KG)</label>
            <input type="number" id="weight" placeholder="Example: 80">

            <label>Your Height (CM)</label>
            <input type="number" id="height" placeholder="Example: 180">

            <button type="button" id="calculate-bmi-btn" onclick="calculateBMI()">CALCULATE BMI</button>

            <div id="bmi-result"></div>
        </div>

    </div>
</section></div><footer>
        <p data-site="footerText">© 2026 IRON FIT. All Rights Reserved.</p>
    </footer><script type="module" src="js/calculator-profile.js"></script><script>const toggle=document.getElementById('menu-toggle');const links=document.getElementById('nav-links');toggle?.addEventListener('click',()=>{const open=links.classList.toggle('is-open');toggle.classList.toggle('is-active',open);toggle.setAttribute('aria-expanded',String(open));});links?.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{links.classList.remove('is-open');toggle?.classList.remove('is-active');toggle?.setAttribute('aria-expanded','false');}));</script></body></html>
