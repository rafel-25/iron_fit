<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Profile Settings — IRON FIT fitness club."><title>Profile Settings | IRON FIT</title><link rel="stylesheet" href="style.css"><style>.settings-section{padding:70px 6%;background:#070c16;min-height:70vh}.profile-card{max-width:760px;margin:0 auto;background:#0b1220;border:1px solid rgba(64,116,174,.25);padding:28px;border-radius:12px}.profile-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.form-group{display:flex;flex-direction:column;gap:8px}.form-group label{color:#aaa;font-size:12px}.profile-card input,.profile-card select{padding:13px;background:#060c16;border:1px solid #294361;border-radius:6px;color:white}.save-profile-btn{margin-top:20px;padding:14px 22px;background:#ff2638;color:#fff;border:0;font-weight:800;cursor:pointer}@media(max-width:650px){.profile-grid{grid-template-columns:1fr}}</style></head><body>
<header class="site-header"><nav class="navbar" aria-label="Main navigation">
<a class="logo" href="index.html" aria-label="IRON FIT home"><img src="assets/iron-fit-logo.svg" alt="IRON FIT — Train, Eat, Grow"></a>
<button class="menu-toggle" id="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false"><span></span><span></span><span></span></button>
<ul class="nav-links" id="nav-links">
<li><a href="index.html">Home</a></li><li><a href="training.html">Training</a></li><li><a href="exercises.html">Exercises</a></li><li><a href="meals.html">Meals</a></li><li><a href="nutrition.html">Nutrition</a></li><li><a href="bmi.html">BMI</a></li><li><a href="calories.html">Calories</a></li><li><a href="user/dashboard.html">Dashboard</a></li>
</ul><div class="nav-actions"><a class="nav-login" href="login.html">LOG IN</a><a class="nav-btn" href="register.html"><span>GET STARTED</span><b>↗</b></a></div></nav></header>
<!-- PROFILE SETTINGS -->
<section id="settings" class="settings-section">
    <div class="section-title">
        <span>YOUR ACCOUNT</span>
        <h2>PROFILE <span>SETTINGS</span></h2>
        <p>Manage your fitness information</p>
    </div>

    <div class="profile-card">
        <div class="profile-header">
            <div class="profile-avatar">IF</div>
            <div>
                <h3 id="profile-display-name">Your Name</h3>
                <p>IRON FIT Member</p>
            </div>
        </div>

        <form id="profile-form">
            <div class="profile-grid">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="profile-name"
                           placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label>Age</label>
                    <input type="number" id="profile-age"
                           placeholder="Your age" min="10" max="100" required>
                </div>

                <div class="form-group">
                    <label>Weight (kg)</label>
                    <input type="number" id="profile-weight"
                           placeholder="Example: 80" min="1" required>
                </div>

                <div class="form-group">
                    <label>Height (cm)</label>
                    <input type="number" id="profile-height"
                           placeholder="Example: 180" min="1" required>
                </div>

                <div class="form-group">
                    <label>Fitness Goal</label>
                    <select id="profile-goal">
                        <option value="Lose Weight">Lose Weight</option>
                        <option value="Build Muscle">Build Muscle</option>
                        <option value="Stay Fit">Stay Fit</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="save-profile-btn">
                SAVE CHANGES
            </button>
            <p id="profile-message"></p>
        </form>
    </div>
</section>
<footer><p>© 2026 IRON FIT. All Rights Reserved.</p></footer>
<script>const menuToggle=document.getElementById('menu-toggle');const navLinks=document.getElementById('nav-links');menuToggle?.addEventListener('click',()=>{const open=navLinks.classList.toggle('is-open');menuToggle.classList.toggle('is-active',open);menuToggle.setAttribute('aria-expanded',String(open));});navLinks?.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{navLinks.classList.remove('is-open');menuToggle?.classList.remove('is-active');menuToggle?.setAttribute('aria-expanded','false');}));</script><script>const f=document.getElementById('profile-form');const load=()=>{const p=JSON.parse(localStorage.getItem('ironfit-profile')||'null');if(!p)return;for(const [k,id] of Object.entries({name:'profile-name',age:'profile-age',weight:'profile-weight',height:'profile-height',goal:'profile-goal'})){const el=document.getElementById(id);if(el&&p[k]!=null)el.value=p[k];}document.getElementById('profile-display-name').textContent=p.name||'Your Name';};load();f?.addEventListener('submit',e=>{e.preventDefault();const p={name:document.getElementById('profile-name').value,age:document.getElementById('profile-age').value,weight:document.getElementById('profile-weight').value,height:document.getElementById('profile-height').value,goal:document.getElementById('profile-goal').value};localStorage.setItem('ironfit-profile',JSON.stringify(p));document.getElementById('profile-display-name').textContent=p.name;document.getElementById('profile-message').textContent='Profile updated successfully!';});</script></body></html>
