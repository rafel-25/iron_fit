<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="IRON FIT fitness platform"><title>Profile Settings | IRON FIT</title><link rel="stylesheet" href="style.css"><style>.site-header{position:relative!important}.page-main{min-height:65vh;padding-top:35px}.logo img{width:155px;height:52px;object-fit:contain;display:block}.nav-links a{white-space:nowrap}@media(max-width:1050px){.nav-links{gap:14px}.nav-links a{font-size:12px}}.page-heading{padding:55px 8% 15px;text-align:center}.page-heading h1{font-size:clamp(30px,5vw,54px)}.page-heading h1 span{color:#ff2638}</style><script>(()=>{const form=document.getElementById('profile-form');if(!form)return;const ids=['name','age','weight','height','goal'];const display=document.getElementById('profile-display-name');try{const p=JSON.parse(localStorage.getItem('ironfit-profile')||'null');if(p){ids.forEach(k=>{const el=document.getElementById('profile-'+k);if(el)el.value=p[k]??''});display.textContent=p.name||'Your Name';}}catch{}form.addEventListener('submit',e=>{e.preventDefault();const p={};ids.forEach(k=>p[k]=document.getElementById('profile-'+k).value);localStorage.setItem('ironfit-profile',JSON.stringify(p));display.textContent=p.name||'Your Name';document.getElementById('profile-message').textContent='Profile updated successfully!';});})();</script></head><body><header class="site-header"><nav class="navbar" aria-label="Main navigation"><a class="logo" href="index.html" aria-label="IRON FIT home"><img src="assets/iron-fit-logo.svg" alt="IRON FIT — Train, Eat, Grow"></a><button class="menu-toggle" id="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false"><span></span><span></span><span></span></button><ul class="nav-links" id="nav-links"><li><a href="index.html">Home</a></li><li><a href="training.html">Training</a></li><li><a href="exercises.html">Exercises</a></li><li><a href="meals.html">Meals</a></li><li><a href="nutrition.html">Nutrition</a></li><li><a href="bmi.html">BMI</a></li><li><a href="calories.html">Calories</a></li><li><a href="dashboard.html">Dashboard</a></li><li><a href="profile.html">Profile</a></li></ul><div class="nav-actions"><a class="nav-login" href="login.html">LOG IN</a><a class="nav-btn" href="register.html"><span>GET STARTED</span><b>↗</b></a></div></nav></header><div class="page-main"><!-- PROFILE SETTINGS -->
<section id="settings" class="settings-section">
    <div class="section-title">
        <span>YOUR ACCOUNT</span>
        <h2>PROFILE <span>SETTINGS</span></h2>
        <p>Manage your fitness information</p>
    </div>

    <div class="profile-card">
        <div class="profile-header">
            <div class="profile-avatar">IF</div>
            <div>
                <h3 id="profile-display-name">Your Name</h3>
                <p>IRON FIT Member</p>
            </div>
        </div>

        <form id="profile-form">
            <div class="profile-grid">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="profile-name"
                           placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label>Age</label>
                    <input type="number" id="profile-age"
                           placeholder="Your age" min="10" max="100" required>
                </div>

                <div class="form-group">
                    <label>Weight (kg)</label>
                    <input type="number" id="profile-weight"
                           placeholder="Example: 80" min="1" required>
                </div>

                <div class="form-group">
                    <label>Height (cm)</label>
                    <input type="number" id="profile-height"
                           placeholder="Example: 180" min="1" required>
                </div>

                <div class="form-group">
                    <label>Fitness Goal</label>
                    <select id="profile-goal">
                        <option value="Lose Weight">Lose Weight</option>
                        <option value="Build Muscle">Build Muscle</option>
                        <option value="Stay Fit">Stay Fit</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="save-profile-btn">
                SAVE CHANGES
            </button>
            <p id="profile-message"></p>
        </form>
    </div>
</section></div><footer>
        <p data-site="footerText">© 2026 IRON FIT. All Rights Reserved.</p>
    </footer><script>const toggle=document.getElementById('menu-toggle');const links=document.getElementById('nav-links');toggle?.addEventListener('click',()=>{const open=links.classList.toggle('is-open');toggle.classList.toggle('is-active',open);toggle.setAttribute('aria-expanded',String(open));});links?.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{links.classList.remove('is-open');toggle?.classList.remove('is-active');toggle?.setAttribute('aria-expanded','false');}));</script></body></html>
