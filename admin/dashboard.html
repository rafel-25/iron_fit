<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | IRON FIT</title><link rel="stylesheet" href="../auth.css"><style>.section{margin:32px 0;padding-top:18px;border-top:1px solid #292929}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid .full{grid-column:1/-1}.item{background:#090909;border:1px solid #292929;padding:14px;margin:8px 0;border-radius:8px}.item button{margin-left:8px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #292929;text-align:left}@media(max-width:650px){.grid{grid-template-columns:1fr}.grid .full{grid-column:auto}}</style></head><body><header class="top"><a class="brand" href="../index.html">IRON<span>FIT.</span> <small>ADMIN</small></a><button id="logout" class="logout">LOG OUT ↗</button></header><main class="panel wide"><p class="eyebrow">CONTROL CENTER</p><h1>ADMIN DASHBOARD.</h1><p class="muted" id="welcome"></p><div class="stats"><article><small>MEMBERS</small><h2 id="membersCount">—</h2></article><article><small>ACTIVE MEMBERS</small><h2 id="activeCount">—</h2></article><article><small>WORKOUTS</small><h2 id="workoutCount">—</h2></article><article><small>NUTRITION PLANS</small><h2 id="planCount">—</h2></article></div><section class="section"><h2>MEMBER MANAGEMENT</h2><div id="members"></div></section><section class="section"><h2>ADD WORKOUT</h2><form id="workoutForm" class="grid"><input id="wTitle" placeholder="Workout title" required><input id="wCategory" placeholder="Category"><select id="wLevel"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select><input id="wDuration" type="number" min="1" max="600" value="30"><textarea id="wDescription" class="full" placeholder="Description"></textarea><button class="full">Add workout</button></form><div id="workouts"></div></section><section class="section"><h2>ADD NUTRITION PLAN</h2><form id="planForm" class="grid"><input id="pTitle" placeholder="Plan title" required><input id="pGoal" placeholder="Goal"><input id="pCalories" type="number" min="0" max="10000" value="2000"><textarea id="pDescription" class="full" placeholder="Description"></textarea><button class="full">Add nutrition plan</button></form><div id="plans"></div></section></main><script type="module" src="../js/admin.js"></script></body></html>
